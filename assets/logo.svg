<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="rn-vconsole-panel">
  <defs>
    <linearGradient id="rnv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2933"/>
      <stop offset="1" stop-color="#3b4a5a"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#rnv-bg)"/>

  <!-- phone outline: the console runs on the device -->
  <rect x="30" y="20" width="68" height="88" rx="10"
        fill="none" stroke="#61dafb" stroke-width="4"/>
  <rect x="54" y="26" width="20" height="3" rx="1.5" fill="#61dafb" opacity=".7"/>

  <!-- console prompt inside it -->
  <path d="M44 58 L54 66 L44 74" fill="none" stroke="#61dafb" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M62 76 H84" stroke="#61dafb" stroke-width="5" stroke-linecap="round"/>
</svg>
